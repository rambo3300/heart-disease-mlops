apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  namespace: heart-disease
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer      # Docker Desktop: reachable on localhost:8080 | Minikube: run `minikube tunnel`
  selector:
    app: heart-disease-api
  ports:
    - name: http
      port: 8080
      targetPort: http
