name: CI/CD - Heart Disease MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8==7.1.1
      - name: Run flake8 (fails the pipeline on any violation)
        run: flake8 src api tests scripts

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies from requirements.txt
        run: pip install -r requirements.txt
      - name: Run pytest with coverage
        run: |
          mkdir -p test-reports
          pytest --junitxml=test-reports/junit.xml \
                 --cov=src --cov=api --cov-report=xml:test-reports/coverage.xml \
                 --cov-report=term-missing
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports/

  train:
    name: Train model
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download + clean data (falls back to the committed copy)
        run: |
          python scripts/download_data.py || python scripts/download_data.py --skip-download
      - name: EDA figures
        run: python -m src.eda
      - name: Train, evaluate and log to MLflow
        run: python -m src.train 2>&1 | tee training.log
      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            models/
            reports/
            mlruns/
            mlflow.db
            training.log
            data/processed/

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - name: Fetch freshly trained model
        uses: actions/download-artifact@v4
        with:
          name: training-artifacts
          path: trained
      - name: Use trained model in the image build context
        run: cp trained/models/* models/
      - name: Build image
        run: docker build -t heart-disease-api:ci .
      - name: Run container
        run: docker run -d --name heart-api -p 8000:8000 heart-disease-api:ci
      - name: Smoke test /health and /predict
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          python scripts/smoke_test.py http://localhost:8000
      - name: Collect container logs
        if: always()
        run: docker logs heart-api > container.log 2>&1 || true
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: container.log
